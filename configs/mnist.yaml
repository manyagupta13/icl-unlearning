name: mnist

data:
  source: mnist          # inputs are real MNIST images, PCA'd to D dims
  task: classification   # y = sign(beta . x), beta fresh per sequence and
                         # SHARED across digit classes -- see MnistSpec docstring
  D: 4                   # PCA dimension (matches the synthetic configs)
  N: 31
  groups: [d1, d3, d8]
  digits: [1, 3, 8]      # d1 <- digit 1, d3 <- digit 3, d8 <- digit 8
  forget: d8             # the group to forget
  center: class          # "class": groups share mean 0, spectral geometry is
                         #   the sole axis of variation (matches MixtureSpec)
                         # "pooled": keeps class means; adds a channel the
                         #   closed form does not model
  seed: 0

probe:
  P: 64
  counts: {d1: 10, d3: 10, d8: 11}
  seed: 777
  n_probe_seeds: 3

train:
  archs: [ATTN-S, ATTN-M]
  n_shadows: 512
  batch_per_shadow: 8
  steps: 6000
  optim: sgd
  lr: 0.005
  momentum: 0.9
  grad_clip: 5.0
  init_scale: 0.05
  seed: 1
  n_train_seeds: 3

sweep:
  seed: 2
  n_boot: 200
  n_shared_reps: 16
  mmd_max_n: 2000
  grids:
    none:  [0.0]
    C1:    [0.0, 0.001, 0.00178, 0.00316, 0.00562, 0.01, 0.0178, 0.0316,
            0.0562, 0.1, 0.178, 0.316, 0.562, 1.0, 1.78, 3.16, 5.62, 10.0,
            17.8, 31.6, 100.0]
    C2:    [0.0, 0.001, 0.00178, 0.00316, 0.00562, 0.01, 0.0178, 0.0316,
            0.0562, 0.1, 0.178, 0.316, 0.562, 1.0, 1.78, 3.16, 5.62, 10.0,
            17.8, 31.6, 100.0]
    C3:    [0.0, 0.001, 0.01, 0.0316, 0.1, 0.316, 1.0, 3.16, 10.0]
    flip:  [0.0, 0.1, 0.2, 0.3, 0.4, 0.44, 0.46, 0.48, 0.5, 0.52, 0.54, 0.56,
            0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.25]
    bern:  [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
            0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
    whiten: [0.0, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0]

paths:
  artifacts: artifacts
  figures: figures
