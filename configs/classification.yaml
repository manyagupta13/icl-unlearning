task: classification        # y = sign(x'beta), labels in {-1, +1}

# Same covariance-defined group structure as the regression config, so the
# regression/classification contrast isolates the read-out, not the data.

data:
  D: 4
  N: 31
  basis: identity
  seed: 0
  groups: [z1, z2, z3]
  forget: z3
  eigs:
    z1: [0.70, 0.15, 0.10, 0.05]
    z2: [0.60, 0.20, 0.10, 0.10]
    z3: [0.40, 0.30, 0.20, 0.10]

probe:
  P: 64
  counts: {z1: 10, z2: 10, z3: 11}
  seed: 777

train:
  archs: [ATTN-S, ATTN-M]
  n_shadows: 100
  batch_per_shadow: 8
  steps: 6000
  optim: sgd
  lr: 0.005
  momentum: 0.9
  grad_clip: 5.0
  init_scale: 0.05
  seed: 1

sweep:
  seed: 2
  grids:
    none:  [0.0]
    # labels are +/-1, so sigma^2 is on a natural scale here; the useful
    # range is narrower than in regression
    C1:    [0.0, 0.01, 0.03, 0.1, 0.3, 0.5, 1.0, 2.0, 4.0]
    C2:    [0.0, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
    C3:    [0.0, 0.01, 0.1, 1.0, 4.0]
    # t=1 is an exact label flip for +/-1 labels
    flip:  [0.0, 0.1, 0.2, 0.3, 0.4, 0.45, 0.5, 0.55, 0.6, 0.7, 0.8, 0.9, 1.0]
    whiten: [0.0, 0.25, 0.5, 0.75, 1.0]

paths:
  artifacts: artifacts
  figures: figures
